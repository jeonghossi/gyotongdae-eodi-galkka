# main 브랜치에 올릴 때마다 public/ 폴더를 GitHub Pages(보기 전용판)로 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 관리자 페이지와 안 쓰는 학생 캡처 사진은 빼고 올림
      - run: mkdir _site && cp -r public/. _site/ && rm -rf _site/admin.html _site/images _site/data/photos.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
